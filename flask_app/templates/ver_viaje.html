<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver viaje</title>
</head>
<body>
    <header>
        <a href="/dashboard">Inicio</a>
        <a href="/logout">Cerrar sesión</a>
    </header>
    <main>
        <h2>{{ viaje.destino }}</h2>
        <ul>
            <li><b>Organizador: </b>{{viaje.nombre}}</li>
            <li><b>Fecha Inicio: </b>{{viaje.fecha_inicio}}</li>
            <li><b>Fecha Fin: </b>{{viaje.fecha_fin}}</li>
            <li><b>Itinerario: </b>{{viaje.itinerario}}</li>
        </ul>
    </main>
</body>
</html>
