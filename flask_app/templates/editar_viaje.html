<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/editar_viaje.css">
    <title>Editar Viaje</title>
</head>
<body>
    <header>
        <h1>Editar Viaje</h1>
        <div>
            <a href="/dashboard">Inicio</a>
            <a href="/logout">Cerrar Sesión</a>

        </div>
    </header>
    <main>
        {% for m in get_flashed_messages(category_filter=["journey"]) %}
        <p class="error">{{ m }}</p>
        {% endfor %}
        <form action="/actualizar_viaje" method="post">
            <input type="hidden" name="id" value="{{viaje.id}}">
            <label for="destino">Destino</label>
            <input type="text" name="destino" value="{{ viaje.destino }}" required><br>
            <label for="fecha_inicio">Fecha de Inicio</label>
            <input type="date" name="fecha_inicio" value="{{ viaje.fecha_inicio }}" required><br>
            <label for="fecha_fin">Fecha de Fin</label>
            <input type="date" name="fecha_fin" value="{{ viaje.fecha_fin }}" required><br>
            <label for="itinerario">Itinerario</label>
            <textarea name="itinerario" id="" required>{{ viaje.itinerario }}</textarea><br>
            <input type="submit" value="Guardar">
        </form>
    </main>
</body>
</html>
