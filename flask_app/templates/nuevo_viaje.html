<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/nuevo_viaje.css">
    <title>Nuevo Viaje</title>
</head>
<body>
    <header>
        <h1>Nuevo Viaje</h1>
        <div>
            <a href="/dashboard">Inicio</a>
            <a href="/logout">Cerrar Sesión</a>
        </div>
    </header>
    <main>
        {% for m in get_flashed_messages(category_filter=["journey"]) %}
        <p class="error">{{ m }}</p>
        {% endfor %}

        <form action="/agregar_viaje" method="post">
            <label for="destino">Destino</label>
            <input type="text" name="destino" required><br>
            <label for="fecha_inicio">Fecha de Inicio</label>
            <input type="date" name="fecha_inicio" id="" required><br>
            <label for="fecha_fin">Fecha de Fin</label>
            <input type="date" name="fecha_fin" id="" required><br>
            <label for="itinerario">Itinerario</label>
            <textarea name="itinerario" id="" required>Pon tu texto aqui.</textarea>
            <input type="submit" value="Guardar">
        </form>
    </main>
</body>
</html>
